name: Build and verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.16.0"

jobs:
  build:
    name: Build production bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || {
            echo "::error::Missing VITE_SUPABASE_URL GitHub secret."
            exit 1
          }

          test -n "$VITE_SUPABASE_ANON_KEY" || {
            echo "::error::Missing VITE_SUPABASE_ANON_KEY GitHub secret."
            exit 1
          }

          rm -rf dist
          npm run build

          test -f dist/index.html || {
            echo "::error::dist/index.html was not generated."
            exit 1
          }

      - name: Build summary
        run: |
          echo "Production build completed successfully."
          echo "Cloudflare Pages deployment is handled automatically by the repository connection."
