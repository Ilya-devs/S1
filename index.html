<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ILYA" />
    <meta name="description" content="نظام محاسبي متكامل بالدينار العراقي — من تطوير ILYA dev" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>ILYA — نظام محاسبي متكامل</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Recover users from a broken/stale PWA service worker after deployments.
      // This runs before the React bundle and only reloads once per browser session.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (registration) {
            var scriptUrl = registration.active && registration.active.scriptURL;
            if (scriptUrl && scriptUrl.indexOf(location.origin) === 0) {
              registration.update().catch(function () {});
            }
          });
        }).catch(function () {});
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
